<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irmak · Indicativo o subjuntivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8F2;--card:#FFFFFF;--ink:#1D2733;--soft:#667080;--line:#E6E0D4;--acc:#0F6E6E;--accbg:#E3F1EF;
  --warm:#C0533A;--warmbg:#FBE9E3;--cream:#F5EFE4;--pick:#FFF1C9;--pickline:#E0B43A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181F;--card:#1B222B;--ink:#E8EAED;--soft:#9AA3AF;
  --line:#2C3540;--acc:#4FC1B5;--accbg:#173431;--warm:#F08A6E;--warmbg:#3A2219;--cream:#222A33;--pick:#3D3417;--pickline:#C9A23B}}
:root[data-theme="dark"]{--bg:#13181F;--card:#1B222B;--ink:#E8EAED;--soft:#9AA3AF;--line:#2C3540;--acc:#4FC1B5;--accbg:#173431;
  --warm:#F08A6E;--warmbg:#3A2219;--cream:#222A33;--pick:#3D3417;--pickline:#C9A23B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
header .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
header h1{font-size:28px;line-height:1.15;margin:4px 0 6px}
header p{color:var(--soft);margin:0 0 18px;font-size:15px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;
  padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm);margin:0 0 6px}
.muted{color:var(--soft);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.chips button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:600}
.topics{margin:8px 0 0;padding-left:20px;font-size:14px}
.article p{margin:0 0 12px;font-size:17px;line-height:1.75}
.s{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .15s}
.s:hover{background:var(--cream)}
.s.picked{background:var(--pick);box-shadow:0 2px 0 var(--pickline)}
.s.hit{background:var(--accbg);box-shadow:0 2px 0 var(--acc)}
.s.miss{background:var(--warmbg);box-shadow:0 2px 0 var(--warm)}
.s.wrong{text-decoration:line-through;text-decoration-color:var(--soft);background:none;box-shadow:none}
.s mark{background:none;color:inherit}
.done .s mark{color:var(--warm);font-weight:600;text-decoration:underline wavy var(--warm) 1px;text-underline-offset:4px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 0}
.btn{border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.score{font-weight:600}
.sol{margin-top:14px}
.sol .row{border-top:1px solid var(--line);padding:12px 0}
.sol .row:first-child{border-top:0}
.w{color:var(--warm);text-decoration:line-through}
.ok{color:var(--acc);font-weight:600}
.tp{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.en{font-size:14px;color:var(--soft);margin-top:4px}
.rule{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0 12px}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.stem{font-size:17px;margin:0 0 8px}
.stem .gap{display:inline-block;min-width:60px;border-bottom:2px solid var(--line);text-align:center;font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:8px 14px;border-radius:10px;cursor:pointer;min-width:64px}
.opts button:disabled{cursor:default}
.opts button.right{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.opts button.bad{background:var(--warmbg);border-color:var(--warm);color:var(--warm);text-decoration:line-through}
.why{font-size:14px;margin-top:8px;display:none}
.answered .why{display:block}
.total{position:sticky;bottom:12px;margin-top:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;font-size:15px}
.total button{background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer}
.reveal{margin-top:8px}
.hidden{display:none}
@media (max-width:520px){header h1{font-size:23px}.article p{font-size:16px}}
</style></head>

<header><div class="k">Irmak · Español B1–B2</div><h1>Indicativo o subjuntivo</h1>
<p>Simulacros del ejercicio formativo del King's, un quiz por temas y frases para corregir.</p></header>
<nav id="tabs"><button data-t="mock" class="on">Simulacros</button><button data-t="quiz">Quiz</button><button data-t="fix">Corrige el error</button></nav>
<main id="mock"></main><main id="quiz" class="hidden"></main><main id="fix" class="hidden"></main>
</div>
<script>
const D = {"topics": {"1": "Perífrasis comunes: haber, estar, ir", "2": "Perífrasis de cambio de estado", "3": "Perífrasis en el estilo indirecto", "4": "Indicativo o subjuntivo con verbos de opinión", "5": "Acciones habituales en pasado", "6": "Causa y consecuencia en futuro"}, "mocks": [{"title": "Serrano será peatonal en 2027 si el plan supera el último trámite", "source": "Noticia adaptada (periódico local). Datos y personas ficticios.", "paragraphs": [["El Ayuntamiento de Madrid presentó ayer el proyecto para cerrar al tráfico el tramo de la calle Serrano entre la plaza de la Independencia y la calle Goya.", "La medida, que afectará a más de trescientos comercios, ha dividido a los vecinos del barrio de Salamanca."], ["La polémica no es nueva.", "En la reunión informativa del martes {{habían}} más de doscientos vecinos, y muchos se quejaron de que el proyecto llega tarde y mal explicado.", "Según la asociación de comerciantes, numerosos locales {{siguen no teniendo}} licencia para ampliar sus terrazas, a pesar de que la solicitaron hace más de un año."], ["Tampoco es la primera vez que cambia el calendario.", "En marzo, la concejala de Urbanismo, Elena Ruiz, aseguró que las obras {{van a empezar}} antes del verano, pero un informe técnico obligó a retrasarlas hasta 2027.", "Ayer, Ruiz pidió paciencia y defendió el proyecto: «Las ciudades que han apostado por el peatón son hoy más ricas y más habitables»."], ["La concejala no cree que la peatonalización {{perjudica}} a los comercios.", "Al contrario: según un estudio municipal, las ventas podrían crecer un 15 % en los dos primeros años."], ["Los vecinos de más edad recuerdan otro Serrano.", "«Hace veinte años, mis padres {{fueron}} al mercado de la Paz todos los sábados y luego tomaban el aperitivo aquí mismo; no había ni la mitad de coches», cuenta Carmen Ortega, de 71 años."], ["El proyecto se votará en el pleno de diciembre.", "Si el plan {{saldrá}} adelante, las obras comenzarán en enero y la calle será peatonal a finales de 2027.", "Como el equipo de gobierno no tiene mayoría absoluta, necesitará el apoyo de al menos un grupo de la oposición."]], "errors": [{"topic": 1, "fix": "había", "rule": "<i>Haber</i> con sentido de existencia es impersonal: siempre en singular (<i>hay, había, hubo, ha habido</i>), aunque lo que sigue sea plural.", "english": "En inglés <i>there <b>were</b> 200 neighbours</i> concuerda con el plural; en español <i>había</i> no tiene sujeto."}, {"topic": 2, "fix": "siguen sin tener", "rule": "Para decir que algo todavía no ha pasado: <i>seguir / llevar</i> + <i>sin</i> + infinitivo, no <i>seguir</i> + <i>no</i> + gerundio.", "english": "Calco de <i>still not having</i>. Además, en inglés va <i>-ing</i> después de <i>without</i>; en español, infinitivo después de <i>sin</i>."}, {"topic": 3, "fix": "iban a empezar", "rule": "Estilo indirecto con verbo introductor en pasado: <i>van a empezar</i> → <i>iban a empezar</i>. Es obligatorio porque la información ya no es válida: las obras se retrasaron.", "english": "Igual que en inglés: <i>she said the works <b>were going to</b> start</i>."}, {"topic": 4, "fix": "perjudique", "rule": "Opinión negada (<i>no cree que</i>) → subjuntivo. En afirmativo: <i>cree que no perjudica</i>.", "english": "En inglés el verbo no cambia (<i>she doesn't think it harms</i>)."}, {"topic": 5, "fix": "iban", "rule": "Acción habitual en el pasado (<i>todos los sábados</i>) → imperfecto, igual que <i>tomaban</i> y <i>había</i> en la misma frase.", "english": "El <i>simple past</i> inglés sirve para hábitos (<i>my parents went every Saturday</i>); el indefinido español, no."}, {"topic": 6, "fix": "sale", "rule": "Condición posible en el futuro: <i>si</i> + presente de indicativo, y la consecuencia en futuro (<i>comenzarán, será</i>). Nunca futuro después de <i>si</i>.", "english": "Como en inglés: <i>if the plan <b>goes</b> ahead, the works <b>will</b> start</i>."}], "traps": [["ha dividido a los vecinos", "Pretérito perfecto: hecho reciente que llega hasta hoy."], ["a pesar de que la solicitaron", "<i>A pesar de que</i> + indicativo: el hecho es real."], ["Como el equipo de gobierno no tiene mayoría absoluta, necesitará…", "<i>Como</i> al principio para la causa: correcto."]]}, {"title": "Empezar de cero a los treinta", "source": "Reportaje adaptado. Testimonios ficticios.", "paragraphs": [["Cada año, miles de jóvenes europeos se mudan a Madrid atraídos por el clima, la comida y un ritmo de vida más tranquilo que el de otras capitales.", "Pero empezar de cero no siempre es fácil.", "Hablamos con tres de ellos."], ["**Elif, 27 años, de Estambul.**", "«{{Llevé}} dos años buscando trabajo en Londres antes de venir.", "Aquí lo encontré en tres meses.", "Mi madre me dijo que {{voy a volver}} a casa en medio año, y ya llevo dos aquí.", "No creo que Madrid {{es}} más barata que Londres, pero con el mismo sueldo vivo mucho mejor.»"], ["**Tom, 31 años, de Mánchester.**", "«Al llegar {{me puse preocupado}}: no entendía nada en las reuniones y la gente hablaba rapidísimo.", "Ahora me río de aquello.", "Lo que más me cuesta son los horarios: de niño siempre {{cenamos}} a las seis y media, y aquí nadie cena antes de las nueve y media.»"], ["**Sofía, 29 años, de Lyon.**", "«Vine para hacer un máster de un año y me quedé.", "Cuando {{terminaré}} el doctorado, decidiré si vuelvo a Francia, aunque sinceramente lo dudo: aquí tengo mi vida.»"], ["Los tres coinciden en algo: Madrid engancha.", "Y, según los expertos, la tendencia irá a más mientras la ciudad siga ofreciendo trabajo y calidad de vida."]], "errors": [{"topic": 1, "fix": "Estuve (dos años buscando)", "rule": "<i>Llevar</i> + tiempo + gerundio solo sirve para algo que dura hasta ahora (<i>llevo dos años aquí</i>). Para un periodo terminado: <i>estuve</i> + gerundio (o <i>pasé dos años buscando</i>).", "english": "<i>I spent / I had been looking for two years</i>: el periodo ya terminó, así que no vale <i>llevar</i>."}, {"topic": 3, "fix": "iba a volver", "rule": "Estilo indirecto en pasado: <i>vas a volver</i> → <i>iba a volver</i>. La predicción no se cumplió (<i>ya llevo dos años aquí</i>).", "english": "<i>My mum told me I <b>was going to</b> come back</i>."}, {"topic": 4, "fix": "sea", "rule": "<i>No creo que</i> + subjuntivo.", "english": "<i>I don't think it <b>is</b></i>: en inglés no hay cambio de modo."}, {"topic": 2, "fix": "me preocupé (o: me puse nervioso)", "rule": "<i>Ponerse</i> + adjetivo expresa cambios momentáneos de ánimo, pero nunca va con participio (<i>*ponerse preocupado, *ponerse enfadado</i>): se usa el verbo pronominal (<i>preocuparse, enfadarse</i>).", "english": "<i>I <b>got</b> worried</i>: <i>get</i> + participio no se traduce con <i>ponerse</i>."}, {"topic": 5, "fix": "cenábamos", "rule": "<i>De niño siempre</i> = hábito en una etapa pasada → imperfecto.", "english": "<i>As a kid we always <b>had</b> dinner at 6.30</i>: el <i>simple past</i> inglés no basta."}, {"topic": 6, "fix": "termine", "rule": "<i>Cuando</i> referido al futuro → presente de subjuntivo; la consecuencia, en futuro (<i>decidiré</i>).", "english": "<i>When I finish</i>: en inglés presente, nunca <i>will</i>; en español, presente de <b>subjuntivo</b>."}], "traps": [["ya llevo dos aquí", "<i>Llevar</i> + tiempo: algo que dura hasta hoy. Correcto, al contrario que <i>llevé</i>."], ["Vine para hacer un máster de un año y me quedé", "Indefinido: hechos puntuales que hacen avanzar la historia."], ["mientras la ciudad siga ofreciendo", "<i>Mientras</i> referido al futuro + subjuntivo."]]}, {"title": "«Contar calorías no es lo mismo que comer bien»", "source": "Entrevista adaptada. Personaje ficticio.", "paragraphs": [["Lucía Ferrer (Valencia, 1985) es nutricionista y lleva diez años pasando consulta en Londres.", "Acaba de publicar Comer sin calculadora, un libro contra las dietas milagro."], ["**¿Por qué un libro contra contar calorías?**"], ["Porque veo a diario lo que pasa.", "Muchas pacientes {{dejan comer}} pan durante tres meses, pierden cuatro kilos y luego vuelven a comerlo con ansiedad.", "Pienso que el problema {{sea}} la información: hay demasiada y casi toda contradictoria."], ["**¿Cómo llegaban sus pacientes al principio?**"], ["Recuerdo a una chica que, en la primera consulta, me contó que {{está comiendo}} solo ensaladas desde hacía meses.", "Estaba agotada.", "Cuando era estudiante, yo también {{cené}} cereales cada noche, así que la entendía perfectamente."], ["**¿Qué planes tiene ahora?**"], ["El mes que viene {{estoy abriendo}} una consulta en Madrid, en el barrio de Salamanca.", "{{Porque}} cada vez más gente come fuera de casa, los restaurantes tendrán que ayudarnos: si informan mejor de lo que sirven, comeremos mejor sin darnos cuenta."], ["**¿Alguna regla de oro?**"], ["Una sola: comer sentada, despacio y sin pantallas.", "Lo demás es negociable."]], "errors": [{"topic": 2, "fix": "dejan de comer", "rule": "Interrumpir una acción: <i>dejar <b>de</b></i> + infinitivo. Sin <i>de</i>, <i>dejar</i> + infinitivo significa “permitir” (<i>dejan comer pan</i> = permiten comer pan).", "english": "<i>Stop eating</i>: el inglés no lleva preposición, y el error cambia el significado."}, {"topic": 4, "fix": "es", "rule": "Opinión afirmativa (<i>pienso que</i>) → indicativo. Solo la opinión negada pide subjuntivo (<i>no pienso que sea</i>).", "english": "Error de hipercorrección: no todo verbo de opinión lleva subjuntivo."}, {"topic": 3, "fix": "estaba comiendo", "rule": "Estilo indirecto en pasado: <i>estoy comiendo</i> → <i>estaba comiendo</i>, coherente con <i>desde hacía meses</i>.", "english": "<i>She told me she <b>had been</b> eating only salads</i>."}, {"topic": 5, "fix": "cenaba", "rule": "Hábito en una etapa del pasado (<i>cuando era estudiante, cada noche</i>) → imperfecto.", "english": "<i>When I was a student I <b>had</b> cereal every night</i>: el <i>simple past</i> inglés no basta."}, {"topic": 1, "fix": "abro (o: voy a abrir)", "rule": "Para un plan futuro se usa el presente o <i>ir a</i> + infinitivo. <i>Estar</i> + gerundio es para una acción en curso, nunca para el futuro.", "english": "Calco del <i>present continuous</i> para planes: <i>next month I'm opening</i>."}, {"topic": 6, "fix": "Como cada vez más gente come fuera de casa, …", "rule": "Si la causa va al principio, se introduce con <i>como</i> (o <i>ya que, dado que</i>). <i>Porque</i> va después de la consecuencia.", "english": "En inglés <i>Because…, …</i> al principio es normal; en español suena a error."}], "traps": [["lleva diez años pasando consulta", "<i>Llevar</i> + tiempo + gerundio: dura hasta hoy."], ["Acaba de publicar", "<i>Acabar de</i> en presente = acción muy reciente."], ["vuelven a comerlo", "<i>Volver a</i> + infinitivo: repetir una acción."], ["si informan mejor…, comeremos", "<i>Si</i> + presente, futuro."]]}, {"title": "Lo que Madrid puede aprender de Estambul", "source": "Artículo de opinión adaptado.", "paragraphs": [["Crecí en Arnavutköy, un antiguo pueblo de pescadores a orillas del Bósforo.", "Antes los pescadores {{vendieron}} el pescado directamente en el muelle cada mañana, y mi abuela elegía el suyo tocándolo con dos dedos, como quien compra una joya."], ["En los últimos años {{hubieron}} muchos cambios.", "Arnavutköy {{se ha hecho un barrio de moda}}, con cafés de diseño y alquileres imposibles, pero el mercado sigue abriendo cada mañana y los vecinos siguen comprando en él."], ["Madrid, en cambio, está perdiendo sus mercados de barrio.", "En 2019, el Ayuntamiento anunció que {{va a reformar}} todos los mercados del distrito, pero desde entonces han cerrado cinco.", "No digo que Madrid {{tiene}} que copiar a Estambul: cada ciudad tiene su historia.", "Pero un mercado no es solo un sitio donde se compra; es el lugar donde los vecinos se conocen."], ["La solución es sencilla, aunque no rápida.", "Madrid no recuperará sus mercados hasta que los vecinos {{volverán}} a comprar en ellos.", "Y eso solo pasará si los mercados ofrecen algo que el supermercado no puede dar: tiempo, conversación y pescado que se elige con dos dedos."]], "errors": [{"topic": 5, "fix": "vendían", "rule": "<i>Antes… cada mañana</i> = hábito pasado → imperfecto, como <i>elegía</i> en la misma frase.", "english": "<i>Fishermen <b>sold</b> fish every morning</i>: el <i>simple past</i> inglés vale para hábitos; el indefinido, no."}, {"topic": 1, "fix": "ha habido (o: hubo)", "rule": "<i>Haber</i> impersonal no tiene plural en ningún tiempo: <i>hubo, ha habido, había, habrá</i>. Con <i>en los últimos años</i> lo natural es el perfecto: <i>ha habido</i>.", "english": "<i>There <b>have been</b> many changes</i>: el plural inglés arrastra el verbo."}, {"topic": 2, "fix": "se ha convertido en un barrio de moda", "rule": "Con un sustantivo con artículo se usa <i>convertirse en</i>. <i>Hacerse</i> va sin artículo y sin <i>en</i> (<i>se hizo rica, se hizo abogada</i>).", "english": "<i>Has become a trendy area</i>: <i>become</i> + <i>a</i> + sustantivo → <i>convertirse en</i>."}, {"topic": 3, "fix": "iba a reformar", "rule": "Estilo indirecto en pasado: <i>vamos a reformar</i> → <i>iba a reformar</i>. El plan no se cumplió (<i>han cerrado cinco</i>).", "english": "<i>The council announced it <b>was going to</b> refurbish them</i>."}, {"topic": 4, "fix": "tenga", "rule": "<i>No digo que</i> + subjuntivo: rechaza una idea que el lector podría atribuirnos.", "english": "<i>I'm not saying Madrid <b>has</b> to copy Istanbul</i>: en inglés no cambia el verbo."}, {"topic": 6, "fix": "vuelvan", "rule": "<i>Hasta que, cuando, en cuanto</i> referidos al futuro → presente de subjuntivo; la consecuencia, en futuro (<i>no recuperará</i>).", "english": "<i>Until neighbours <b>start</b> shopping there again</i>: nunca futuro detrás de <i>hasta que</i>."}], "traps": [["sigue abriendo cada mañana", "<i>Seguir</i> + gerundio: la acción continúa."], ["está perdiendo sus mercados", "<i>Estar</i> + gerundio: proceso en curso."], ["si los mercados ofrecen algo", "<i>Si</i> + presente de indicativo."]]}], "quiz": [{"key": "opinion", "title": "Opinión: creo que… / no creo que…", "rule": "Afirmar una opinión (<i>creo, pienso, me parece, considero que</i>) → indicativo. Negarla (<i>no creo que…</i>) → subjuntivo.", "items": [{"stem": "Creo que el pan de masa madre ___ menos calorías de lo que dice todo el mundo.", "opts": ["tiene", "tenga"], "ok": 0, "why": "<i>Creo que</i> afirma una opinión → indicativo."}, {"stem": "No creo que en Madrid ___ difícil encontrar piso en el barrio de Salamanca si tienes presupuesto.", "opts": ["es", "sea"], "ok": 1, "why": "Opinión negada → subjuntivo."}, {"stem": "Me parece que este restaurante de Arnavutköy ___ el mejor meze de Estambul.", "opts": ["sirve", "sirva"], "ok": 0, "why": "<i>Me parece que</i> = creo que → indicativo."}, {"stem": "No me parece que una ensalada de 600 calorías ___ una cena ligera.", "opts": ["es", "sea"], "ok": 1, "why": "<i>No me parece que</i> → subjuntivo."}, {"stem": "Mi entrenador piensa que ___ comer más proteína.", "opts": ["debo", "deba"], "ok": 0, "why": "<i>Piensa que</i> afirma → indicativo."}, {"stem": "No pienso que ___ necesario contar calorías todos los días.", "opts": ["es", "sea"], "ok": 1, "why": "<i>No pienso que</i> → subjuntivo."}, {"stem": "Mis amigas de Bebek no creen que me ___ a vivir a Madrid de verdad.", "opts": ["voy", "vaya"], "ok": 1, "why": "<i>No creen que</i> → subjuntivo de <i>irse</i>: <i>me vaya</i>."}, {"stem": "¿No crees que este vestido me ___ mejor en negro?", "opts": ["queda", "quede"], "ok": 0, "why": "Pregunta negativa para buscar acuerdo (= “¿verdad que me queda mejor?”) → indicativo."}]}, {"key": "duda", "title": "Probabilidad y duda", "rule": "<i>Es posible / probable que, puede que, dudo que, no estoy segura de que</i> → subjuntivo. <i>Seguro que, estoy segura de que, a lo mejor</i> → indicativo. <i>Quizá, tal vez, probablemente</i> → los dos.", "items": [{"stem": "Es probable que el año que viene ___ erfecto) de subjuntivo.", "items": [{"stem": "No creo que Irmak ___ ya el vuelo.", "opts": ["ha reservado", "haya reservado", "hubiera reservado"], "ok": 1, "why": "<i>Ha reservado</i> → <i>haya reservado</i>."}, {"stem": "Mi madre quería que ___ Medicina.", "opts": ["estudie", "estudiara"], "ok": 1, "why": "<i>Quería</i> (pasado) → imperfecto de subjuntivo."}, {"stem": "Me sorprendió que el restaurante ___ cerrado.", "opts": ["esté", "estuviera"], "ok": 1, "why": "<i>Me sorprendió</i> → imperfecto de subjuntivo."}, {"stem": "Es posible que anoche ___ demasiado: hoy no tengo hambre.", "opts": ["comí", "coma", "comiera"], "ok": 2, "why": "Hecho pasado bajo <i>es posible que</i> → <i>comiera</i> (o <i>haya comido</i>)."}, {"stem": "Si ___ en Madrid, cenaría fuera todas las semanas.", "opts": ["vivo", "viviera"], "ok": 1, "why": "Hipótesis en presente: <i>si</i> + imperfecto de subjuntivo, condicional."}, {"stem": "Le pedí que no ___ tan tarde.", "opts": ["llegue", "llegara"], "ok": 1, "why": "<i>Pedí</i> → imperfecto de subjuntivo."}, {"stem": "Me alegró mucho que mis amigos me ___ por mi cumpleaños.", "opts": ["llaman", "llamaran"], "ok": 1, "why": "<i>Me alegró</i> → imperfecto de subjuntivo."}]}, {"key": "causa", "title": "Causa y consecuencia (B2)", "rule": "Causa delante → <i>como, ya que, dado que</i>; detrás → <i>porque</i>. Consecuencia → <i>así que, por eso, de modo que</i>. Condición → <i>si</i> + indicativo; <i>en caso de que, a no ser que</i> y <i>como</i> (amenaza) + subjuntivo.", "items": [{"stem": "___ mañana hay huelga de metro, iré andando a clase.", "opts": ["Como", "Porque"], "ok": 0, "why": "Causa al principio → <i>como</i>."}, {"stem": "Iré andando a clase ___ mañana hay huelga de metro.", "opts": ["como", "porque"], "ok": 1, "why": "Causa detrás → <i>porque</i>."}, {"stem": "___ no te des prisa, perderemos el vuelo.", "opts": ["Si", "Como"], "ok": 1, "why": "<i>Como</i> + subjuntivo = condición o amenaza. Con <i>si</i> sería <i>si no te das prisa let cur = 0;
function renderMock() {
  const m = D.mocks[cur]; let e = 0;
  const chips = D.mocks.map((x, i) => `<button class="${i === cur ? 'on' : ''}" data-i="${i}">Simulacro ${i + 1}</button>`).join('');
  const paras = m.paragraphs.map(p => '<p>' + p.map(s => {
    const n = (s.match(/\{\{/g) || []).length;
    const ids = Array.from({length: n}, () => e++);
    const html = s.replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return `<span class="s" data-e="${ids.join(',')}">${html}</span>`;
  }).join(' ') + '</p>').join('');
  $('#mock').innerHTML = `<div class="chips">${chips}</div>
  <div class="card"><h3>Cómo funciona</h3><div class="muted">El texto es correcto y natural, pero tiene <b>seis errores</b>, uno de cada tema. Ojo: también hay frases correctas que parecen errores.
  Toca las frases que creas que tienen un error y pulsa <b>Comprobar</b>. En el examen: copia la frase, corrígela y explica la regla.</div>
  <ol class="topics">${Object.values(D.topics).map(t => `<li>${t}</li>`).join('')}</ol></div>
  <div class="card article" id="art"><h2>${m.title}</h2><p class="muted" style="font-size:13px">${m.source}</p>${paras}
  <div class="bar"><button class="btn" id="chk">Comprobar</button><button class="btn ghost" id="rst">Empezar de nuevo</button><span class="score" id="sc"></span></div></div>
  <div class="card sol hidden" id="sol"></div>`;
  document.querySelectorAll('#mock .chips button').forEach(b => b.onclick = () => { cur = +b.dataset.i; renderMock(); });
  document.querySelectorAll('#art .s').forEach(s => s.onclick = () => { if (!$('#art').classList.contains('done')) s.classList.toggle('picked'); });
  $('#chk').onclick = checkMock; $('#rst').onclick = renderMock;
}
function checkMock() {
  const m = D.mocks[cur]; const art = $('#art'); if (art.classList.contains('done')) return;
  art.classList.add('done'); let found = 0, extra = 0;
  art.querySelectorAll('.s').forEach(s => {
    const isErr = s.dataset.e !== ''; const p = s.classList.contains('picked');
    s.classList.remove('picked');
    if (isErr) { s.classList.add(p ? 'hit' : 'miss'); if (p) found += s.dataset.e.split(',').length; }
    else if (p) { s.classList.add('wrong'); extra++; }
  });
  $('#sc').textContent = `Has encontrado ${found} de 6` + (extra ? ` · ${extra} frase${extra > 1 ? 's' : ''} correcta${extra > 1 ? 's' : ''} marcada${extra > 1 ? 's' : ''}` : '');
  const sents = m.paragraphs.flat().flatMap(s => (s.match(/\{\{(.+?)\}\}/g) || []).map(w => ({s, w: w.slice(2, -2)})));
  $('#sol').innerHTML = '<h3>Soluciones</h3>' + m.errors.map((e, i) => {
    const {s, w} = sents[i];
    const line = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\{\{(.+?)\}\}/g, (x, y) => y === w ? `<span class="w">${y}</span>` : y);
    return `<div class="row"><div class="tp">Tema ${e.topic} · ${D.topics[e.topic]}</div><div>${line}</div>
      <div>→ <span class="ok">${e.fix}</span></div><div style="font-size:15px;margin-top:4px">${e.rule}</div><div class="en">${e.english}</div></div>`;
  }).join('') + `<div class="row"><h3 style="margin-top:6px">Trampas: parecen errores, pero son correctas</h3>` +
    m.traps.map(([t, why]) => `<div style="margin:6px 0"><i>${t}</i><div class="en" style="color:var(--ink)">${why}</div></div>`).join('') + '</div>';
  $('#sol').classList.remove('hidden');
}

/* ---------- quiz ---------- */
let qsec = 'all';
function renderQuiz() {
  const chips = [{key: 'all', title: 'Todo'}].concat(D.quiz).map(s =>
    `<button class="${s.key === qsec ? 'on' : ''}" data-k="${s.key}">${s.key === 'all' ? 'Todo' : s.title.split(':')[0]}</button>`).join('');
  const secs = D.quiz.filter(s => qsec === 'all' || s.key === qsec).map(s => `<div class="card"><h3>${s.title}</h3>
    <div class="rule">${s.rule}</div>${s.items.map((it, i) => `<div class="q" data-ok="${it.ok}">
      <p class="stem">${it.stem.replace('___', '<span class="gap">…</span>')}</p>
      <div class="opts">${it.opts.map((o, j) => `<button data-j="${j}">${o}</button>`).join('')}</div>
      <div class="why">${it.why}</div></div>`).join('')}</div>`).join('');
  $('#quiz').innerHTML = `<div class="chips">${chips}</div>${secs}
    <div class="total"><span id="qt">0 / 0</span><button id="qr">Reiniciar</button></div>`;
  document.querySelectorAll('#quiz .chips button').forEach(b => b.onclick = () => { qsec = b.dataset.k; renderQuiz(); });
  document.querySelectorAll('#quiz .q').forEach(q => q.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    if (q.classList.contains('answered')) return;
    const ok = +q.dataset.ok, j = +b.dataset.j; q.classList.add('answered'); q.dataset.res = j === ok ? '1' : '0';
    q.querySelectorAll('.opts button').forEach(x => { x.disabled = true; if (+x.dataset.j === ok) x.classList.add('right'); });
    if (j !== ok) b.classList.add('bad');
    const gap = q.querySelector('.gap'); gap.textContent = q.querySelectorAll('.opts button')[ok].textContent;
    tally();
  }));
  $('#qr').onclick = renderQuiz; tally();
}
function tally() {
  const qs = [...document.querySelectorAll('#quiz .q')]; const done = qs.filter(q => q.dataset.res);
  const right = done.filter(q => q.dataset.res === '1').length;
  $('#qt').textContent = `${right} bien de ${done.length} · ${qs.length - done.length} por hacer`;
}

/* ---------- fix ---------- */
function renderFix() {
  $('#fix').innerHTML = `<div class="card"><h3>Como en el examen</h3><div class="muted">Cada frase tiene un error de uno de los seis temas.
    Piensa la corrección y la regla, y luego mira la solución.</div></div><div class="card">${D.fix.map(f => `<div class="q">
    <p class="stem">${f.s}</p><button class="btn ghost">Ver corrección</button>
    <div class="reveal hidden"><div class="tp">Tema ${f.topic} · ${D.topics[f.topic]}</div>
    <div>${f.s.replace(f.wrong, `<span class="w">${f.wrong}</span>`)} → <span class="ok">${f.fix}</span></div>
    <div class="en" style="color:var(--ink)">${f.why}</div></div></div>`).join('')}</div>`;
  document.querySelectorAll('#fix .q').forEach(q => { const b = q.querySelector('button');
    b.onclick = () => { q.querySelector('.reveal').classList.remove('hidden'); b.remove(); }; });
}
renderMock(); renderQuiz(); renderFix();
</script></body></html>
